<title>Em Busca do Forasteiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Rye&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
  /* Layout: cena de tela cheia em canvas de baixa resolução; narração no canto superior esquerdo;
     cartaz em canvas de alta resolução por cima. Mundo único (sertão ao entardecer), sem tema alternativo. */
  :root {
    --tição: #1b120d;
    --couro: #3a2418;
    --areia: #f3dfb4;
    --poente: #f2a65a;
    --vinho: #8e2a20;
    --poeira: #d9b88a;
    --font-title: "Pixelify Sans", "Courier New", monospace;
    --font-tale: "Pixelify Sans", "Courier New", monospace;
    --font-tale-sc: "Pixelify Sans", "Courier New", monospace;
    --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--tição);
    color: var(--areia);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  canvas.full {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #stage { image-rendering: pixelated; image-rendering: crisp-edges; }
  #poster-layer { pointer-events: none; }
  .layer {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    text-align: center;
  }
  .title {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(40px, 9vw, 96px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: var(--areia);
    text-shadow: 4px 4px 0 var(--tição);
    margin: 0;
    text-wrap: balance;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--poente);
    margin: 0;
  }
  .sub {
    font-size: 14px;
    max-width: 46ch;
    line-height: 1.6;
    margin: 0;
    color: var(--areia);
    text-shadow: 2px 2px 0 var(--tição);
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.04em;
    padding: 12px 20px;
    border: 3px solid var(--tição);
    background: var(--poente);
    color: var(--tição);
    box-shadow: 4px 4px 0 var(--tição);
    cursor: pointer;
    min-height: 48px;
  }
  button.secondary { background: var(--areia); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tição); }
  button:focus-visible { outline: 3px solid var(--areia); outline-offset: 3px; }
  /* tela inicial: cena da estrada ao fundo, elenco à esquerda, o escolhido girando à direita */
  #gate {
    background: radial-gradient(ellipse at 72% 55%, rgba(242,166,90,0.22), transparent 50%), linear-gradient(90deg, rgba(18,11,8,0.9) 0%, rgba(18,11,8,0.78) 50%, rgba(18,11,8,0.5) 100%);
    overflow-y: auto; justify-content: safe center;
  }
  .gate-grid { display: grid; grid-template-columns: minmax(0, 560px) auto; gap: clamp(20px, 5vw, 80px); align-items: center; width: min(1080px, 100%); text-align: left; }
  .gate-left { display: grid; gap: 16px; justify-items: start; }
  .title .t-small { display: block; font-size: 0.4em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--poente); margin-bottom: 4px; }
  .title .t-big { display: block; }
  .cast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; width: 100%; }
  .cast-card {
    display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; min-height: 0;
    font-family: var(--font-title); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--areia);
    background: rgba(243, 223, 180, 0.07); border: 3px solid rgba(243, 223, 180, 0.22); box-shadow: none;
  }
  .cast-card canvas { width: 48px; height: 72px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .cast-card:hover { background: rgba(243, 223, 180, 0.14); }
  .cast-card[aria-checked="true"] { background: rgba(242, 166, 90, 0.24); border-color: var(--poente); box-shadow: 4px 4px 0 var(--tição); color: #fff4dc; }
  .cast-card:active { transform: none; }
  .hero-info { min-height: 64px; }
  .hero-name { margin: 0 0 4px; font-family: var(--font-title); font-weight: 700; font-size: 24px; color: #fff4dc; text-shadow: 2px 2px 0 var(--tição); }
  .hero-tag { margin: 0; font-size: 14px; line-height: 1.5; max-width: 46ch; text-shadow: 2px 2px 0 var(--tição); }
  #start { font-size: 20px; padding: 14px 28px; }
  .gate-hint { margin: 0; font-size: 12px; color: rgba(243, 223, 180, 0.75); }
  .gate-right { display: grid; justify-items: center; }
  #hero-view { width: 340px; height: 340px; image-rendering: pixelated; image-rendering: crisp-edges; background: radial-gradient(circle at 50% 62%, rgba(242,166,90,0.32), transparent 62%); }
  @media (max-width: 860px) {
    #gate { background: radial-gradient(ellipse at 50% 22%, rgba(242,166,90,0.22), transparent 45%), linear-gradient(180deg, rgba(18,11,8,0.6), rgba(18,11,8,0.88)); }
    .gate-grid { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .gate-left { justify-items: center; gap: 12px; }
    .gate-right { order: -1; }
    #hero-view { width: 192px; height: 192px; }
    .cast { gap: 6px; }
    .cast-card { padding: 6px 2px; font-size: 11px; }
    .cast-card canvas { width: 40px; height: 60px; }
    .hero-info { min-height: 0; }
  }
  @media (max-width: 860px) and (max-height: 760px) { #hero-view { width: 144px; height: 144px; } .title { font-size: clamp(34px, 9vw, 56px); } }
  /* alto-falante: canto discreto, acompanha a página toda */
  #sound {
    position: fixed; z-index: 60; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    width: 44px; height: 44px; min-height: 0; padding: 0; display: grid; place-items: center;
    background: rgba(27, 18, 13, 0.82); color: var(--areia); border: 2px solid rgba(243, 223, 180, 0.4); box-shadow: 3px 3px 0 var(--tição);
  }
  #sound svg { width: 24px; height: 24px; }
  #sound .mute { display: none; }
  #sound.off { color: #b8a888; }
  #sound.off .waves { display: none; } #sound.off .mute { display: inline; }
  #hud {
    position: fixed; z-index: 5;
    top: max(12px, env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; gap: 10px;
  }
  #hud button { font-size: 14px; padding: 8px 14px; min-height: 40px; }

  /* faixas de cinema: a narração mora na faixa de cima, a dica na de baixo */
  .bar {
    position: fixed; left: 0; right: 0; z-index: 3;
    background: #120b08;
    pointer-events: none;
    transition: transform 900ms cubic-bezier(.2,.7,.2,1);
  }
  #bar-top { top: 0; height: 15vh; transform: translateY(-100%); }
  #bar-bottom { bottom: 0; height: 7.5vh; transform: translateY(100%); }
  .cinema #bar-top, .cinema #bar-bottom { transform: none; }
  #tale {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
  }
  #tale p {
    position: absolute;
    margin: 0;
    max-width: min(46ch, calc(100vw - 480px));
    font-family: var(--font-tale);
    font-weight: 500;
    font-size: clamp(17px, 2vw, 26px);
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-align: center;
    color: #f6e7c4;
    text-wrap: balance;
    opacity: 0;
    transition: opacity 600ms ease;
  }
  #tale p.on { opacity: 1; }
  #tale p .w { opacity: 0; transition: opacity 380ms ease; }
  #tale p .w.in { opacity: 1; }
  #tale p.big {
    font-family: var(--font-tale-sc);
    font-weight: 700;
    font-size: clamp(22px, 3vw, 40px);
    letter-spacing: 0.04em;
    color: var(--poente);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* dica do espaço */
  #hint {
    position: absolute; inset: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; justify-content: center; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #fff4dc; text-shadow: 2px 2px 0 var(--tição);
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: opacity 500ms ease;
  }
  #hint kbd {
    font-family: var(--font-title); font-size: 13px; letter-spacing: 0.08em;
    padding: 4px 12px; border: 2px solid var(--tição); background: var(--areia); color: var(--tição);
    box-shadow: 3px 3px 0 var(--tição);
  }
  #hint.boost kbd { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tição); background: var(--poente); }

  #arrival { pointer-events: none; justify-content: flex-end; padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); }
  #arrival .row { pointer-events: auto; }
  .enter-prompt {
    margin: 0; font-family: var(--font-title); font-size: clamp(16px, 2vw, 20px); letter-spacing: 0.08em;
    color: #fff4dc; text-shadow: 2px 2px 0 var(--tição);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .enter-prompt kbd {
    font-family: var(--font-title); font-size: 15px; padding: 5px 14px;
    border: 2px solid var(--tição); background: var(--areia); color: var(--tição); box-shadow: 3px 3px 0 var(--tição);
  }
  @media (prefers-reduced-motion: no-preference) { .enter-prompt kbd { animation: nudge 1.6s ease-in-out infinite; } }
  @keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tição); } }
  html.site-on #arrival, html.site-on #hud, html.site-on #gate { display: none !important; }
  #arrival > * { opacity: 0; transform: translateY(8px); transition: opacity 600ms ease, transform 600ms ease; }
  #arrival.show > * { opacity: 1; transform: none; }
  #arrival.show > :nth-child(2) { transition-delay: 250ms; }
  #arrival.show > :nth-child(3) { transition-delay: 500ms; }
  #arrival.show > :nth-child(4) { transition-delay: 800ms; }
  .caption {
    position: fixed; left: 0; right: 0;
    bottom: max(14px, env(safe-area-inset-bottom, 0px));
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    text-align: center; color: rgba(243,223,180,0.75);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  @media (max-width: 900px) {
    #bar-top { height: 21vh; }
    #tale { align-items: flex-end; padding-bottom: 14px; }
    #tale p { max-width: calc(100vw - 32px); font-size: clamp(16px, 4.2vw, 21px); }
    #tale p.big { font-size: clamp(20px, 5.4vw, 28px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #arrival > *, #tale p, #tale p .w, .bar { transition: none; }
  }
</style>

<canvas id="stage" class="full" aria-hidden="true"></canvas>
<canvas id="poster-layer" class="full" aria-hidden="true"></canvas>

<section id="gate" class="layer" aria-labelledby="gate-title">
  <div class="gate-grid">
    <div class="gate-left">
      <p class="kicker">Portfólio de João Pedro</p>
      <h1 id="gate-title" class="title"><span class="t-small">Em busca do</span><span class="t-big">Forasteiro</span></h1>
      <p class="sub">Escolha quem vai seguir a trilha até a vila.</p>
      <div class="cast" id="cast" role="radiogroup" aria-label="Escolha seu personagem"></div>
      <div class="hero-info"><p class="hero-name" id="hero-name"></p><p class="hero-tag" id="hero-tag"></p></div>
      <button id="start" type="button">Iniciar aventura</button>
      <p class="gate-hint">Na estrada, segure espaço (ou a tela) para galopar mais rápido.</p>
    </div>
    <div class="gate-right"><canvas id="hero-view" width="64" height="64" aria-hidden="true"></canvas></div>
  </div>
</section>
<button id="sound" type="button" aria-pressed="true" aria-label="Som ligado. Clique para silenciar">
  <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="4" width="3" height="4" fill="currentColor"/><rect x="4" y="3" width="1" height="6" fill="currentColor"/><rect x="5" y="2" width="1" height="8" fill="currentColor"/><g class="waves"><rect x="8" y="4" width="1" height="4" fill="currentColor"/><rect x="10" y="2" width="1" height="8" fill="currentColor"/><rect x="9" y="3" width="1" height="1" fill="currentColor"/><rect x="9" y="8" width="1" height="1" fill="currentColor"/></g><g class="mute"><rect x="7" y="4" width="1" height="1" fill="currentColor"/><rect x="8" y="5" width="1" height="1" fill="currentColor"/><rect x="9" y="6" width="1" height="1" fill="currentColor"/><rect x="10" y="7" width="1" height="1" fill="currentColor"/><rect x="10" y="4" width="1" height="1" fill="currentColor"/><rect x="9" y="5" width="1" height="1" fill="currentColor"/><rect x="8" y="6" width="1" height="1" fill="currentColor"/><rect x="7" y="7" width="1" height="1" fill="currentColor"/></g></svg>
</button>

<div id="bar-top" class="bar"><div id="tale" aria-hidden="true"></div></div>
<div id="bar-bottom" class="bar"><div id="hint" hidden><kbd id="hint-key">Espaço</kbd><span id="hint-text">segure para galopar mais rápido</span></div></div>
<p id="tale-sr" class="sr-only" aria-live="polite"></p>

<div id="hud" hidden>
  <button id="skip" type="button">Pular</button>
</div>

<section id="arrival" class="layer" aria-label="Portfólio" hidden>
  <p class="enter-prompt" id="enter-prompt"><kbd>Espaço</kbd> para entrar no portfólio</p>
  <div class="row">
    <button id="enter-vila" type="button">Entrar</button>
    <button id="replay" type="button" class="secondary">Rever a chegada</button>
  </div>
</section>

<p class="caption" id="caption" hidden>Prévia da abertura · arte e trilha provisórias</p>

<script>
(() => {
  "use strict";

  // ---------- Configuração ----------
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const pcan = document.getElementById("poster-layer");
  const pctx = pcan.getContext("2d");
  let H = 180, W = 320, HORIZON = 85;

  // Linha do tempo em "segundos de história" (avança mais rápido com espaço)
  const P = {
    fadeIn: 1.5,
    townFull: 32.0,
    dustFrom: 9.0,
    papersFrom: 20.0,
    fogStart: 26.0,
    fogFull: 31.5,
    posterStart: 30.5,
    posterArrive: 33.5,
    posterLeave: 41.0,
    posterGone: 42.2,
    revealEnd: 43.4,
    arrivalText: 42.8,
  };

  const TALE = [
    { at: 2.0,  text: "Contam as lendas que, numa vila simples do sertão, surgiu um grande programador." },
    { at: 7.6,  text: "Um dos mais rápidos do oeste." },
    { at: 11.6, text: "Nunca perdeu um duelo." },
    { at: 15.6, text: "Nunca teve piedade de bugs." },
    { at: 20.0, text: "Dizem que o código dele é tão limpo que brilha no sol. Dá para reconhecer a mais de um quilômetro." },
    { at: 26.6, big: true, text: "Um dos programadores mais temidos do oeste." },
  ];
  const WORDS_PER_S = 4.2; // palavras por segundo de história

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isTouch = window.matchMedia("(pointer: coarse)").matches;

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);
  const easeIn = (t) => t * t;
  const easeOut = (t) => 1 - (1 - t) * (1 - t);
  const prog = (p, a, b) => clamp((p - a) / (b - a));

  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  function resize() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    if (aspect >= 1) { H = 180; W = Math.round(clamp(H * aspect, 180, 400)); }
    else { W = 180; H = Math.round(clamp(W / aspect, 180, 400)); }
    canvas.width = W; canvas.height = H;
    HORIZON = Math.round(H * (aspect < 0.8 ? 0.56 : 0.47));
    ctx.imageSmoothingEnabled = false;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    pcan.width = Math.round(window.innerWidth * dpr);
    pcan.height = Math.round(window.innerHeight * dpr);
  }

  function makeCanvas(w, h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    return [c, g];
  }

  function disc(g, x, y, r, color) {
    g.fillStyle = color;
    const rr = Math.max(0.5, r);
    for (let dy = -Math.floor(rr); dy <= Math.floor(rr); dy++) {
      const w = Math.floor(Math.sqrt(rr * rr - dy * dy));
      g.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1);
    }
  }

  // ---------- Pontilhado ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const patternCache = new Map();
  function ditherPattern(color, level) {
    const key = color + level;
    if (patternCache.has(key)) return patternCache.get(key);
    const [c, g] = makeCanvas(4, 4);
    g.fillStyle = color;
    for (let i = 0; i < 16; i++) if (BAYER[i] < level) g.fillRect(i % 4, Math.floor(i / 4), 1, 1);
    const p = ctx.createPattern(c, "repeat");
    patternCache.set(key, p);
    return p;
  }
  function ditherFill(color, amount) {
    const level = Math.round(clamp(amount) * 16);
    if (level <= 0) return;
    if (level >= 16) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); return; }
    ctx.fillStyle = ditherPattern(color, level);
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- Cores ----------
  const COL = {
    k: "#1b120d",
    horse: "#7c4f2c", horseL: "#a06c3e", horseD: "#563419", horseDD: "#3e2412",
    mane: "#3e2618", hoof: "#2a1e18", sole: "#7a6a5c",
    pants: "#28221f", pantsL: "#3c3430", boot: "#1e1816", stirrup: "#b0a898",
    coat: "#3c3230", coatD: "#26201e",
    blanket: "#8e2a20", blanketL: "#b04434", saddle: "#4a2e1c", saddleL: "#6a4428",
    cactus: "#5e7d4a", cactusL: "#7fa060", cactusD: "#3e5a32",
    weed: "#a07a48", weedD: "#6e5030",
    road: "#e8c28a", crack: "#8a5a34", groundD: "#b98450",
    town: "#8a5a40", townD: "#5e3a28", townL: "#b07a52", roof: "#a8502e", window: "#2b1a12",
    paper: "#f3e6c4", paperD: "#cdb68a",
  };

  // ---------- Cavalo e cavaleiro, vistos de trás ----------
  const riderImg = new Image();
  riderImg.src = "data:image/png;base64,__RIDER_PNG__";
  // ---------- Elenco: cinco forasteiros para escolher ----------
  // a mesma ficha desenha o personagem na seleção (frente, lado e costas), na cavalgada (costas) e no duelo (frente)
  const HEROES = [
    { id: "pistoleiro", name: "Pistoleiro clássico", short: "Pistoleiro", weapon: "revolver", tag: "Chapéu escuro, sobretudo, lenço vermelho e o revólver de sempre.",
      skin: "#c48c64", skinD: "#8a5c40", hair: "#2a1e18", hairStyle: "short", facial: "beard", facialColor: "#3a2a22",
      hat: "#2c2421", hatStyle: "cowboy", band: "#3e2e28", coat: "#3c3230", shirt: "#2a2422", scarf: "#8a2a22", pants: "#28221f", boot: "#1e1816" },
    { id: "misterioso", name: "Forasteiro misterioso", short: "Misterioso", weapon: "twin", tag: "Fala pouco e saca com as duas mãos. Ninguém sabe de onde veio.",
      skin: "#c8946c", skinD: "#946446", hair: "#141010", hairStyle: "short", facial: "stubble", facialColor: "#4a3a32",
      hat: "#141212", hatStyle: "flat", band: "#8a8682", coat: "#1c1a1a", shirt: "#5a5654", vest: "#2a2626", scarf: null, pants: "#2a2626", boot: "#100c0a" },

  // 4 quadros de galope. Ordem: 0 apoio, 1 perna esquerda no ar, 2 suspensão, 3 perna direita no ar

    const FW = 60, FH = 78;

    const bobH = [0, -1, -2, -1][f];             // garupa sobe e desce

    // --- patas dianteiras, entre as traseiras e mais escuras ---
    const liftF = [[3, 0], [0, 0], [0, 3], [1, 1]][f];

      g.fillStyle = COL.hoof; g.fillRect(x, bottom - 1, 3, 2);
    });

    // --- pernas traseiras ---
    const lift = [[0, 0], [7, 0], [2, 2], [0, 7]][f];
    const legX = [cx - 11, cx + 6];
    for (let i = 0; i < 2; i++) {
      const top = cy + 3, bottom = FH - 2 - lift[i];
      for (let y = top; y <= bottom; y++) {
        const upper = y < top + 8;
        const w = upper ? 6 : 4;
        const x = legX[i] + (upper ? 0 : 1);
        g.fillStyle = COL.k; g.fillRect(x - 1, y, w + 2, 1);
        g.fillStyle = upper ? (i === 0 ? COL.horse : COL.horseD) : COL.horseDD; g.fillRect(x, y, w, 1);

      }

      g.fillStyle = lift[i] > 3 ? COL.sole : COL.hoof; g.fillRect(legX[i] + 1, bottom - 2, 4, 2);

      g.fillStyle = COL.weedD;
      g.fillRect(Math.round(7 + Math.cos(a) * 6), Math.round(7 + Math.sin(a) * 6), 1, 1);

  function drawTown() {

    g.fillStyle = COL.window; g.fillRect(58, 32, 4, 8);

  // árvore seca da caatinga: 22 x 30
  function drawDeadTree() {
    const [c, g] = makeCanvas(22, 30);
    const br = (x0, y0, x1, y1) => {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let i = 0; i <= n; i++) {
        const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
        g.fillStyle = COL.k; g.fillRect(x - 1, y, 3, 1);
        g.fillStyle = "#6e5642"; g.fillRect(x, y, 1, 1);
      }
    };
    g.fillStyle = COL.k; g.fillRect(9, 12, 4, 18);
    g.fillStyle = "#6e5642"; g.fillRect(10, 12, 2, 18);
    br(10, 14, 3, 6); br(5, 9, 2, 3); br(11, 12, 18, 4); br(16, 7, 20, 2); br(11, 16, 16, 12); br(10, 13, 9, 1);
    return c;
  }
  // pedra grande: 26 x 16
  function drawBoulder() {
    const [c, g] = makeCanvas(26, 16);
    for (let y = 0; y < 16; y++) {
      const w = Math.round(12 * Math.sqrt(1 - Math.pow((y - 10) / 10, 2)) || 0);
      if (w <= 0) continue;
      g.fillStyle = COL.k; g.fillRect(13 - w - 1, y, w * 2 + 2, 1);
      g.fillStyle = y < 6 ? "#c79a68" : "#a8794a"; g.fillRect(13 - w, y, w * 2, 1);
      g.fillStyle = "#8a6038"; g.fillRect(13 + Math.round(w * 0.4), y, Math.round(w * 0.6), 1);
    }
    g.fillStyle = "#e0b886"; g.fillRect(7, 4, 5, 1);
    return c;
  }
  // cerca de varas quebrada: 28 x 12
  function drawFence() {
    const [c, g] = makeCanvas(28, 12);
    [1, 12, 24].forEach((x, i) => {
      g.fillStyle = COL.k; g.fillRect(x - 1, i === 1 ? 3 : 0, 4, 12);
      g.fillStyle = "#7a5a3c"; g.fillRect(x, i === 1 ? 4 : 1, 2, 11);
    });
    g.fillStyle = COL.k; g.fillRect(0, 3, 15, 3); g.fillRect(12, 6, 15, 3);
    g.fillStyle = "#9a7650"; g.fillRect(1, 4, 13, 1); g.fillRect(13, 7, 13, 1);

  function drawSkull() {
    const [c, g] = makeCanvas(12, 6);
    g.fillStyle = "#efe4cc";
    g.fillRect(4, 1, 4, 4); g.fillRect(0, 0, 3, 1); g.fillRect(9, 0, 3, 1); g.fillRect(2, 1, 2, 1); g.fillRect(8, 1, 2, 1);
    g.fillStyle = COL.k; g.fillRect(4, 2, 1, 1); g.fillRect(7, 2, 1, 1);

  }

  const SPR = {};
  function buildSprites() {
    prepareRider();
    SPR.mount = [0, 1, 2, 3].map(drawMountFrame);
    SPR.cactus = [0, 1, 2].map(drawCactus);
    SPR.weed = drawWeed();
    SPR.town = drawTown();
    SPR.skull = drawSkull();
    SPR.tree = drawDeadTree();

  // ---------- Cartaz de procurado (alta resolução) ----------
  const portrait = new Image();
  portrait.src = "data:image/png;base64,__PORTRAIT_PNG__";
  let posterCanvas = null;

  function wrapText(g, text, x, y, maxW, lh) {
    const words = text.split(" ");
    let line = "", yy = y;
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (g.measureText(test).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; }
      else line = test;
    }
    if (line) g.fillText(line, x, yy);
    return yy;
  }

  // escreve centralizado, diminuindo a letra até caber na largura
  function fitText(g, text, size, family, x, y, maxW) {
    let px = size;
    g.font = `${px}px ${family}`;
    while (g.measureText(text).width > maxW && px > 10) { px -= 2; g.font = `${px}px ${family}`; }
    g.fillText(text, x, y);
  }

  function buildPoster() {
    const PW = 600, PH = 920;
    const c = document.createElement("canvas");
    c.width = PW; c.height = PH;
    const g = c.getContext("2d");
    seed = 4242;

    // papel com bordas rasgadas
    const pts = [];
    const jag = (n, f) => { for (let i = 0; i <= n; i++) pts.push(f(i / n, (rnd() - 0.5) * 10)); };
    jag(30, (t, j) => [14 + t * (PW - 28), 12 + j]);
    jag(44, (t, j) => [PW - 12 + j, 14 + t * (PH - 28)]);
    jag(30, (t, j) => [PW - 14 - t * (PW - 28), PH - 12 + j]);
    jag(44, (t, j) => [12 + j, PH - 14 - t * (PH - 28)]);
    g.save();
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
    g.shadowColor = "rgba(20,10,5,0.45)"; g.shadowBlur = 18; g.shadowOffsetY = 8;
    g.fillStyle = "#ecd9ad"; g.fill();
    g.shadowColor = "transparent";
    g.clip();
    // manchas e granulação
    for (let i = 0; i < 6000; i++) {
      g.fillStyle = `rgba(${rnd() < 0.5 ? "120,80,40" : "255,245,220"},${0.05 + rnd() * 0.08})`;
      g.fillRect(rnd() * PW, rnd() * PH, 1 + rnd() * 2, 1 + rnd() * 2);
    }
    for (let i = 0; i < 7; i++) {
      const x = rnd() * PW, y = rnd() * PH, r = 30 + rnd() * 90;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, "rgba(150,100,50,0.13)"); rg.addColorStop(1, "rgba(150,100,50,0)");
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // bordas queimadas
    const edge = g.createRadialGradient(PW / 2, PH / 2, PH * 0.32, PW / 2, PH / 2, PH * 0.66);
    edge.addColorStop(0, "rgba(90,50,20,0)"); edge.addColorStop(1, "rgba(90,50,20,0.55)");
    g.fillStyle = edge; g.fillRect(0, 0, PW, PH);
    g.restore();

    const ink = "#2a1a10";
    g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "alphabetic";

    // prego no topo
    g.fillStyle = "#3a2a20"; g.beginPath(); g.arc(PW / 2, 34, 7, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#8a7a6a"; g.beginPath(); g.arc(PW / 2 - 2, 32, 2.5, 0, Math.PI * 2); g.fill();

    g.fillStyle = ink;
    fitText(g, "PROCURADO", 104, 'Rye, "Times New Roman", serif', PW / 2, 138, PW - 96);
    g.fillRect(70, 160, PW - 140, 4); g.fillRect(70, 168, PW - 140, 1);

    // retrato
    const fx = 110, fy = 188, fw = 380, fh = 475;
    g.fillStyle = ink; g.fillRect(fx - 10, fy - 10, fw + 20, fh + 20);
    g.fillStyle = "#e3cfa0"; g.fillRect(fx - 6, fy - 6, fw + 12, fh + 12);
    g.fillStyle = ink; g.fillRect(fx - 3, fy - 3, fw + 6, fh + 6);
    g.imageSmoothingEnabled = false;
    if (portrait.complete && portrait.naturalWidth) g.drawImage(portrait, fx, fy, fw, fh);
    g.imageSmoothingEnabled = true;

    g.fillStyle = ink;
    fitText(g, "JOÃO PEDRO", 70, 'Rye, "Times New Roman", serif', PW / 2, 742, PW - 110);
    fitText(g, "o código mais limpo do oeste", 33, '"IM Fell English SC", Georgia, serif', PW / 2, 782, PW - 110);
    g.fillRect(150, 802, PW - 300, 2);
    g.font = '28px Rye, "Times New Roman", serif';
    g.fillText("RECOMPENSA", PW / 2, 838);
    fitText(g, "$ 1.000.000", 58, 'Rye, "Times New Roman", serif', PW / 2, 896, PW - 140);
    posterCanvas = c;
  }

  // ---------- Mundo em pseudo-3D ----------
  const FOCAL = 60, CAM_H = 30;
  let props = [], weeds = [], dust = [], papers = [];

  const project = (wx, z) => { const s = FOCAL / z; return { x: W / 2 + wx * s, y: HORIZON + CAM_H * s, s }; };

  function spawnProp(z) {
    const r = rnd(), side = rnd() < 0.5 ? -1 : 1;
    if (p >= P.papersFrom - 4 && p < P.posterStart && rnd() < 0.5)
      return { kind: "paper", wx: (rnd() - 0.5) * 70, z, tilt: rnd() < 0.5 ? 0 : 1 };
    if (r < 0.17) return { kind: "cactus", v: Math.floor(rnd() * 3), wx: side * (40 + rnd() * 130), z };
    if (r < 0.25) return { kind: "big", spr: "tree", wx: side * (55 + rnd() * 130), z, k: 0.9 };
    if (r < 0.31) return { kind: "big", spr: "boulder", wx: side * (45 + rnd() * 140), z, k: 0.8 };
    if (r < 0.35) return { kind: "big", spr: "fence", wx: side * (40 + rnd() * 60), z, k: 0.8 };
    if (r < 0.38) return { kind: "skull", wx: side * (18 + rnd() * 40), z };
    if (r < 0.55) return { kind: "stone", wx: (rnd() - 0.5) * 220, z, r: 0.6 + rnd() * 1.2 };
    return { kind: "crack", wx: (rnd() - 0.5) * 200, z, len: 4 + rnd() * 10 };
  }

  function resetWorld() {
    seed = 7;
    props = [];
    for (let i = 0; i < 70; i++) props.push(spawnProp(6 + rnd() * 240));
    weeds = []; dust = []; papers = []; poles = [];
  }

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
    g.addColorStop(0, "#d9813f"); g.addColorStop(0.55, "#f0b567"); g.addColorStop(1, "#f9e3b0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON);
    ctx.fillStyle = ditherPattern("#fff1cf", 4); ctx.fillRect(0, HORIZON - 14, W, 14);
    const sx = Math.round(W * 0.7), sy = Math.round(HORIZON * 0.42);
    const pulse = Math.sin(t * 2) * 0.6;
    disc(ctx, sx, sy, 30 + pulse, "rgba(255,236,190,0.18)");
    disc(ctx, sx, sy, 22 + pulse, "rgba(255,240,205,0.28)");
    disc(ctx, sx, sy, 15, "#fff3d6");
    disc(ctx, sx, sy, 12, "#fffbea");
  }

  function drawMountains() {
    ctx.fillStyle = "#c48b62";
    for (let x = 0; x < W; x++) {
      const h = 6 + Math.round(Math.sin(x * 0.045) * 4 + Math.sin(x * 0.11 + 1) * 2 + Math.sin(x * 0.017) * 5);
      ctx.fillRect(x, HORIZON - h, 1, h);
    }
    ctx.fillStyle = "#b07a56";
    for (let x = 0; x < W; x++) {
      const h = 2 + Math.round(Math.sin(x * 0.07 + 2) * 2 + Math.sin(x * 0.023) * 3);
      if (h > 0) ctx.fillRect(x, HORIZON - h, 1, h);
    }
  }

  function drawTownAt(t, scale, haze) {
    const img = SPR.town;
    const w = img.width * scale, h = img.height * scale;
    const x0 = W / 2 - w / 2, y0 = HORIZON - h + Math.max(1, scale * 1.5);
    const slices = Math.max(6, Math.round(h / 2));
    for (let i = 0; i < slices; i++) {
      const sy = (img.height / slices) * i, sh = img.height / slices;
      const off = Math.round(Math.sin(t * 7 + i * 0.9) * haze);
      ctx.drawImage(img, 0, sy, img.width, sh, Math.round(x0 + off), Math.round(y0 + (h / slices) * i), Math.round(w), Math.ceil(h / slices));
    }
  }

  function drawGround(dist) {
    const g = ctx.createLinearGradient(0, HORIZON, 0, H);
    g.addColorStop(0, "#e4b97e"); g.addColorStop(1, "#c98f55");
    ctx.fillStyle = g; ctx.fillRect(0, HORIZON, W, H - HORIZON);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W / 2 - 2, HORIZON); ctx.lineTo(W / 2 + 2, HORIZON);
    ctx.lineTo(W / 2 + W * 0.32, H); ctx.lineTo(W / 2 - W * 0.32, H); ctx.closePath(); ctx.clip();
    ctx.fillStyle = ditherPattern(COL.road, 7); ctx.fillRect(0, HORIZON, W, H - HORIZON);
    for (let i = 0; i < 18; i++) {
      const z = ((i * 14 - dist) % 252 + 252) % 252 + 4;
      for (const side of [-1, 1]) {
        const p = project(side * 14, z);
        ctx.fillStyle = "rgba(160,110,64,0.55)";
        ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.max(1, Math.round(p.s)), Math.max(1, Math.round(p.s * 3)));
      }
    }
    ctx.restore();
    for (let i = 0; i < 14; i++) {
      const z = ((i * 18 - dist) % 252 + 252) % 252 + 4;
      const p = project(0, z);
      ctx.fillStyle = "rgba(185,132,80,0.22)";
      ctx.fillRect(0, Math.round(p.y), W, Math.max(1, Math.round(p.s * 0.6)));
    }
  }

  let poles = [];
  function drawPoles(dz) {
    if (!poles.length) for (let i = 0; i < 9; i++) poles.push(8 + i * 30);
    poles = poles.map((z) => { z -= dz; return z < 3 ? z + 270 : z; }).sort((a, b) => b - a);
    const tops = [];
    for (const z of poles) {
      const q = project(78, z);
      const h = Math.round(46 * q.s), w = Math.max(1, Math.round(1.6 * q.s));
      if (q.x > W + 20) { tops.push(null); continue; }
      ctx.fillStyle = COL.k; ctx.fillRect(Math.round(q.x) - 1, Math.round(q.y - h), w + 2, h);
      ctx.fillStyle = "#6e5642"; ctx.fillRect(Math.round(q.x), Math.round(q.y - h), w, h);
      const cw = Math.max(2, Math.round(9 * q.s));
      ctx.fillStyle = COL.k; ctx.fillRect(Math.round(q.x - cw / 2), Math.round(q.y - h + 3 * q.s), cw, Math.max(1, Math.round(q.s)));
      tops.push({ x: q.x, y: q.y - h + 3 * q.s });
    }
    ctx.fillStyle = "rgba(43,29,22,0.7)";
    for (let i = 0; i < tops.length - 1; i++) {
      const a = tops[i], b = tops[i + 1];
      if (!a || !b) continue;
      const n = Math.ceil(Math.abs(b.x - a.x));
      for (let k = 0; k <= n; k++) {
        const t = k / Math.max(1, n);
        const sag = Math.sin(t * Math.PI) * Math.abs(b.x - a.x) * 0.06;
        ctx.fillRect(Math.round(a.x + (b.x - a.x) * t), Math.round(a.y + (b.y - a.y) * t + sag), 1, 1);
      }
    }
  }

  function drawProps(dz) {
    for (const pr of props) {
      pr.z -= dz;
      // um panfleto no chão, quando o cavalo passa, é erguido pela poeira
      if (pr.kind === "paper" && pr.z < 13) {
        const q = project(pr.wx, pr.z);
        kickPaper(q.x, q.y, Math.sign(pr.wx || (rnd() - 0.5)), q.s);
        Object.assign(pr, spawnProp(240 + rnd() * 20));
        continue;
      }
      if (pr.z < 3) Object.assign(pr, spawnProp(240 + rnd() * 20));
    }
    props.sort((a, b) => b.z - a.z);
    for (const p of props) {
      const q = project(p.wx, p.z);
      if (q.y < HORIZON + 1 || q.x < -60 || q.x > W + 60) continue;
      if (p.kind === "cactus") {
        const img = SPR.cactus[p.v], s = q.s * 0.9;
        const w = img.width * s, h = img.height * s;
        if (w < 1) continue;
        ctx.fillStyle = "rgba(90,50,24,0.28)";
        ctx.fillRect(Math.round(q.x - w * 0.4), Math.round(q.y - 1), Math.round(w * 0.9), Math.max(1, Math.round(s)));
        ctx.drawImage(img, Math.round(q.x - w / 2), Math.round(q.y - h), Math.round(w), Math.round(h));
      } else if (p.kind === "paper") {
        // deitado na terra: um retângulo achatado pela perspectiva
        const w = Math.max(1, Math.round(6 * q.s)), h = Math.max(1, Math.round(2 * q.s));
        if (q.s < 0.25) continue;
        ctx.fillStyle = "rgba(90,50,24,0.35)"; ctx.fillRect(Math.round(q.x - w / 2) + 1, Math.round(q.y) + 1, w, h);
        ctx.fillStyle = p.tilt ? COL.paperD : COL.paper; ctx.fillRect(Math.round(q.x - w / 2), Math.round(q.y), w, h);
      } else if (p.kind === "big") {
        const img = SPR[p.spr], s = q.s * p.k;
        const w = img.width * s, h = img.height * s;
        if (w < 2) continue;
        ctx.fillStyle = "rgba(90,50,24,0.25)";
        ctx.fillRect(Math.round(q.x - w * 0.45), Math.round(q.y - 1), Math.round(w * 0.9), Math.max(1, Math.round(s)));
        ctx.drawImage(img, Math.round(q.x - w / 2), Math.round(q.y - h), Math.round(w), Math.round(h));
      } else if (p.kind === "skull") {
        const img = SPR.skull, s = q.s * 0.7;
        if (s < 0.4) continue;
        ctx.drawImage(img, Math.round(q.x - (img.width * s) / 2), Math.round(q.y - img.height * s), Math.round(img.width * s), Math.round(img.height * s));
      } else if (p.kind === "stone") {
        const r = p.r * q.s;
        if (r < 0.5) { ctx.fillStyle = COL.groundD; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1); continue; }
        disc(ctx, q.x, q.y - r * 0.5, r, "#a8794a");
        disc(ctx, q.x - r * 0.3, q.y - r * 0.7, r * 0.5, "#c89a64");
      } else {
        ctx.fillStyle = COL.crack;
        const len = Math.max(1, Math.round(p.len * q.s));
        ctx.fillRect(Math.round(q.x), Math.round(q.y), len, 1);
        if (len > 3) ctx.fillRect(Math.round(q.x + len * 0.6), Math.round(q.y) + 1, Math.round(len * 0.5), 1);
      }
    }
  }

  function updateWeeds(p, dt, rate) {
    if (weeds.length < 3 && rnd() < dt * 0.5 && p > 1) {
      const dir = rnd() < 0.5 ? -1 : 1;
      weeds.push({ dir, z: 20 + rnd() * 50, x: dir < 0 ? W + 20 : -20, phase: rnd() * 6, spin: 0, speed: 28 + rnd() * 20 });
    }
    for (const w of weeds) {
      w.x += w.dir * w.speed * dt * (FOCAL / w.z) * 0.6;
      w.z -= dt * 10 * rate;
      w.spin += dt * w.dir * 6;
      w.phase += dt * 7;
    }
    weeds = weeds.filter((w) => w.x > -40 && w.x < W + 40 && w.z > 6);
    for (const w of weeds) {
      const q = project(0, w.z), s = q.s * 0.7;
      const size = SPR.weed.width * s, bounce = Math.abs(Math.sin(w.phase)) * 6 * s;
      ctx.fillStyle = "rgba(90,50,24,0.25)";
      ctx.fillRect(Math.round(w.x - size / 2), Math.round(q.y - 1), Math.round(size), 1);
      ctx.save();
      ctx.translate(Math.round(w.x), Math.round(q.y - size / 2 - bounce));
      ctx.rotate(Math.round(w.spin * 4) / 4);
      ctx.drawImage(SPR.weed, Math.round(-size / 2), Math.round(-size / 2), Math.round(size), Math.round(size));
      ctx.restore();
    }
  }

  // a faixa de baixo cobre 7,5% da tela: o cavalo galopa logo acima dela
  const groundY = () => H - Math.round(H * 0.075) - 2;
  function mountPos() {
    const img = SPR.mount[0];
    return { x: Math.round(W / 2 - img.width / 2), y: Math.round(groundY() - img.height + 3) };
  }

  function drawMount(frame) {
    const img = SPR.mount && SPR.mount[frame];
    if (!img) return;
    const { x, y } = mountPos();
    ctx.fillStyle = "rgba(80,44,20,0.35)";
    ctx.fillRect(x + 12, groundY() + 1, img.width - 24, 2);
    ctx.drawImage(img, x, y);
  }

  function emitDust(dt, intensity, rate) {
    const n = Math.floor((22 + intensity * 150) * dt * (0.6 + rate * 0.4) + rnd());
    for (let i = 0; i < n; i++) {
      const side = rnd() < 0.5 ? -1 : 1;
      dust.push({
        x: W / 2 + side * (5 + rnd() * 9), y: groundY() - 2 - rnd() * 3,
        vx: side * (6 + rnd() * 26) * (0.6 + intensity), vy: -(4 + rnd() * 10) * (0.6 + intensity),
        r: 1 + rnd() * 2, grow: 4 + rnd() * 10 * (0.4 + intensity), life: 0, max: 1.1 + rnd() * 1.4,
      });
    }
    if (intensity > 0.18 && rnd() < dt * intensity * 34) {
      const side = rnd() < 0.5 ? -1 : 1;
      dust.push({
        x: side < 0 ? rnd() * W * 0.3 : W - rnd() * W * 0.3, y: H + 4,
        vx: -side * (4 + rnd() * 10), vy: -(8 + rnd() * 14),
        r: 10 + rnd() * 10, grow: 16 + rnd() * 18, life: 0, max: 2.4 + rnd(),
      });
    }
  }

  function drawDust(dt) {
    for (const d of dust) {
      d.life += dt; d.x += d.vx * dt; d.y += d.vy * dt;
      d.vx *= 0.985; d.vy *= 0.985; d.r += d.grow * dt;
    }
    dust = dust.filter((d) => d.life < d.max);
    for (const d of dust) {
      const lvl = Math.round(clamp((1 - d.life / d.max) * 1.1) * 16);
      if (lvl <= 0) continue;
      const r = d.r;
      ctx.fillStyle = ditherPattern("#d9b88a", lvl);
      for (let dy = -Math.floor(r); dy <= Math.floor(r); dy++) {
        const w = Math.floor(Math.sqrt(r * r - dy * dy));
        ctx.fillRect(Math.round(d.x - w), Math.round(d.y + dy), w * 2 + 1, 1);
      }
      ctx.fillStyle = ditherPattern("#ecd4a8", Math.max(1, lvl - 6));
      const r2 = r * 0.55;
      for (let dy = -Math.floor(r2); dy <= Math.floor(r2); dy++) {
        const w = Math.floor(Math.sqrt(r2 * r2 - dy * dy));
        ctx.fillRect(Math.round(d.x - r * 0.25 - w), Math.round(d.y - r * 0.25 + dy), w * 2 + 1, 1);
      }
    }
  }

  // panfletos erguidos do chão: sobem com a poeira, giram, perdem força e voltam a cair devagar
  function kickPaper(x, y, side, s) {
    const up = 0.6 + easeIn(prog(p, P.dustFrom, P.fogFull)) * 0.9;
    papers.push({
      x, y, side,
      vx: side * (18 + rnd() * 30) * up, vy: -(45 + rnd() * 45) * up,
      flip: rnd() * 6, spin: (rnd() < 0.5 ? -1 : 1) * (5 + rnd() * 9),
      phase: rnd() * 6, size: clamp(s * 0.9, 0.9, 2.2), life: 0, max: 3.5 + rnd() * 2,
    });
  }
  function updatePapers(p, dt, rate) {
    const lift = easeIn(prog(p, P.dustFrom, P.fogFull));
    // de vez em quando o casco também chuta um panfleto que estava perto
    if (p > P.papersFrom && p < P.posterStart && rnd() < dt * (0.4 + lift * 3) * rate) {
      const side = rnd() < 0.5 ? -1 : 1;
      kickPaper(W / 2 + side * (8 + rnd() * 8), groundY() - 2, side, 1.6);
    }
    for (const q of papers) {
      q.life += dt;
      // gravidade fraca, arrasto do ar e a corrente de ar quente da poeira
      q.vy += (26 - 40 * lift * Math.max(0, 1 - q.life / 2)) * dt;
      q.vx *= Math.pow(0.55, dt); q.vy *= Math.pow(0.7, dt);
      // o papel desliza de lado enquanto vira (folha caindo)
      const wob = Math.sin(q.life * 4.2 + q.phase);
      q.x += (q.vx + wob * 14 + q.side * 6 * rate) * dt;
      q.y += (q.vy + Math.abs(wob) * 4) * dt;
      q.flip += q.spin * dt * (0.6 + Math.abs(q.vy) / 60);
    }
    papers = papers.filter((q) => q.x > -20 && q.x < W + 20 && q.y > -20 && q.y < H + 10 && q.life < q.max);
    for (const q of papers) {
      const fade = clamp((q.max - q.life) / 0.6);
      if (fade <= 0) continue;
      const w = Math.max(1, Math.round(Math.abs(Math.cos(q.flip)) * 5 * q.size));
      const h = Math.max(2, Math.round((4 + Math.abs(Math.sin(q.flip * 0.5)) * 2) * q.size));
      const x = Math.round(q.x - w / 2), y = Math.round(q.y - h / 2);
      ctx.globalAlpha = fade;
      ctx.fillStyle = COL.k; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = Math.cos(q.flip) > 0 ? COL.paper : COL.paperD;
      ctx.fillRect(x, y, w, h);
      if (w >= 3 && h >= 4 && Math.cos(q.flip) > 0) {
        ctx.fillStyle = "#8a6a44";
        ctx.fillRect(x + 1, y + 1, w - 2, 1);
        ctx.fillRect(x + 1, y + 3, Math.max(1, w - 3), 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Chegada ----------
  // fonte de pixel 5 x 7 só com as letras da placa
  const GLYPHS = {
    V: ["10001", "10001", "10001", "10001", "01010", "01010", "00100"],
    I: ["111", "010", "010", "010", "010", "010", "111"],
    L: ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
    A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
    P: ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
    "Ê": ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
    " ": ["000", "000", "000", "000", "000", "000", "000"],
    O: ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
    R: ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
    T: ["11111", "00100", "00100", "00100", "00100", "00100", "00100"],
    F: ["11111", "10000", "10000", "11110", "10000", "10000", "10000"],
    "Ó": ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
  };
  function pixelText(text, cx, y, color, light) {
    const chars = [...text];
    const width = chars.reduce((w, ch) => w + GLYPHS[ch][0].length + 1, -1);
    let x = Math.round(cx - width / 2);
    for (const ch of chars) {
      const g = GLYPHS[ch];
      g.forEach((row, ry) => [...row].forEach((b, rx) => {
        if (b !== "1") return;
        ctx.fillStyle = light; ctx.fillRect(x + rx + 1, y + ry + 1, 1, 1);
        ctx.fillStyle = color; ctx.fillRect(x + rx, y + ry, 1, 1);
      }));
      if (ch === "Ó") { ctx.fillStyle = color; ctx.fillRect(x + 3, y - 3, 1, 1); ctx.fillRect(x + 2, y - 2, 1, 1); }
      if (ch === "Ê") { ctx.fillStyle = color; ctx.fillRect(x + 2, y - 3, 1, 1); ctx.fillRect(x + 1, y - 2, 1, 1); ctx.fillRect(x + 3, y - 2, 1, 1); }
      x += g[0].length + 1;
    }
  }

  // ipê-amarelo ao lado da porteira, soltando flores
  let petals = [];
  function drawIpe(t, x, baseY) {
    seed = 321;
    ctx.fillStyle = COL.k; ctx.fillRect(x - 2, baseY - 46, 6, 47);
    ctx.fillStyle = "#5a4232"; ctx.fillRect(x - 1, baseY - 46, 4, 46);
    ctx.fillStyle = "#7a5a44"; ctx.fillRect(x - 1, baseY - 46, 1, 46);
    // galhos
    [[-10, -58], [12, -60], [-4, -66], [6, -54]].forEach(([dx, dy]) => {
      const n = Math.max(Math.abs(dx), Math.abs(dy + 46));
      for (let i = 0; i <= n; i++) {
        ctx.fillStyle = "#4a3426";
        ctx.fillRect(Math.round(x + 1 + dx * i / n), Math.round(baseY - 46 + (dy + 46) * i / n), 2, 1);
      }
    });
    // copa: bolotas amarelas com sombra e brilho
    const blobs = [[0, -66, 14], [-12, -60, 11], [13, -60, 12], [-5, -54, 10], [8, -52, 9], [-16, -52, 7], [18, -52, 7]];
    blobs.forEach(([dx, dy, r]) => disc(ctx, x + dx, baseY + dy + 1, r + 1, "#8a5a1a"));
    blobs.forEach(([dx, dy, r]) => disc(ctx, x + dx, baseY + dy, r, "#e8b020"));
    blobs.forEach(([dx, dy, r]) => disc(ctx, x + dx - r * 0.3, baseY + dy - r * 0.35, r * 0.55, "#ffd84a"));
    for (let i = 0; i < 40; i++) {
      const a = rnd() * Math.PI * 2, rr = rnd() * 20;
      ctx.fillStyle = rnd() < 0.5 ? "#fff1a0" : "#c98a10";
      ctx.fillRect(Math.round(x + Math.cos(a) * rr), Math.round(baseY - 60 + Math.sin(a) * rr * 0.6), 1, 1);
    }
    // flores caindo
    if (petals.length < 14 && Math.random() < 0.08) petals.push({ x: x - 18 + Math.random() * 36, y: baseY - 56, ph: Math.random() * 6, v: 6 + Math.random() * 6 });
    for (const pt of petals) { pt.y += pt.v / 60; pt.x += Math.sin(t * 2 + pt.ph) * 0.15 - 0.05; }
    petals = petals.filter((pt) => pt.y < baseY + 18);
    ctx.fillStyle = "#ffd23a";
    for (const pt of petals) ctx.fillRect(Math.round(pt.x), Math.round(pt.y), 1, 1);
  }

  function drawArrival(t) {
    drawSky(t);
    drawMountains();
    drawTownAt(t, 2, 0.3);
    ctx.fillStyle = "#d9a868"; ctx.fillRect(0, HORIZON, W, H - HORIZON);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W / 2 - 40, HORIZON); ctx.lineTo(W / 2 + 40, HORIZON);
    ctx.lineTo(W / 2 + W * 0.5, H); ctx.lineTo(W / 2 - W * 0.5, H); ctx.closePath(); ctx.clip();
    ctx.fillStyle = ditherPattern(COL.road, 9); ctx.fillRect(0, HORIZON, W, H - HORIZON);
    ctx.restore();
    const gx0 = Math.round(W / 2 - 70), gx1 = Math.round(W / 2 + 70), gy = HORIZON + 30;
    drawIpe(t, gx1 + 34, gy + 6);

    const postTop = gy - 80;
    ctx.fillStyle = COL.k;
    ctx.fillRect(gx0 - 1, postTop, 8, gy - postTop + 2); ctx.fillRect(gx1 - 6, postTop, 8, gy - postTop + 2);
    ctx.fillStyle = "#6e4426"; ctx.fillRect(gx0, postTop + 1, 6, gy - postTop); ctx.fillRect(gx1 - 5, postTop + 1, 6, gy - postTop);
    ctx.fillStyle = "#8a5a34"; ctx.fillRect(gx0, postTop + 1, 2, gy - postTop); ctx.fillRect(gx1 - 5, postTop + 1, 2, gy - postTop);
    const beamY = postTop - 6;
    ctx.fillStyle = COL.k; ctx.fillRect(gx0 - 6, beamY, gx1 - gx0 + 13, 10);
    ctx.fillStyle = "#8a5a34"; ctx.fillRect(gx0 - 5, beamY + 1, gx1 - gx0 + 11, 8);
    ctx.fillStyle = "#a8743e"; ctx.fillRect(gx0 - 5, beamY + 1, gx1 - gx0 + 11, 2);
    ctx.fillStyle = "#5a3820"; for (let x = gx0; x < gx1; x += 9) ctx.fillRect(x, beamY + 5, 4, 1);
    // placa pendurada por correntes, balançando de leve
    const sway = Math.round(Math.sin(t * 1.3) * 1.2);
    const sw = 64, sh = 19, sx = Math.round(W / 2 - sw / 2) + sway, sy = beamY + 24;
    const hooks = [Math.round(W / 2 - 22), Math.round(W / 2 + 22)];
    hooks.forEach((hx) => {
      const ex = hx + sway, ey = sy;
      ctx.fillStyle = COL.k; ctx.fillRect(hx - 1, beamY + 9, 3, 2);
      for (let k = 0; k < 14; k++) {
        const x = Math.round(hx + (ex - hx) * k / 13), y = beamY + 11 + k;
        ctx.fillStyle = k % 2 ? "#5e5650" : "#b0a898"; ctx.fillRect(x, y, k % 2 ? 1 : 2, 1);
      }
    });
    ctx.fillStyle = COL.k; ctx.fillRect(sx - 1, sy - 1, sw + 2, sh + 2);
    for (let r = 0; r < sh; r++) {
      ctx.fillStyle = r % 6 === 5 ? "#8a5a34" : r % 6 === 0 ? "#d4a46a" : "#c08a52";
      ctx.fillRect(sx, sy + r, sw, 1);
    }
    ctx.fillStyle = "#5a3820"; [[3, 3], [sw - 4, 3], [3, sh - 4], [sw - 4, sh - 4]].forEach(([x, y]) => ctx.fillRect(sx + x, sy + y, 1, 1));
    pixelText("PORTFÓLIO", Math.round(W / 2) + sway, sy + 7, "#2b1a10", "#e2b47a");
    // o cartaz pregado no mourão esquerdo
    ctx.fillStyle = COL.k; ctx.fillRect(gx0 + 6, gy - 34, 11, 14);
    ctx.fillStyle = COL.paper; ctx.fillRect(gx0 + 7, gy - 33, 9, 12);
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(gx0 + 9, gy - 30, 5, 5); ctx.fillRect(gx0 + 8, gy - 32, 7, 1); ctx.fillRect(gx0 + 8, gy - 23, 7, 1);
    ctx.drawImage(SPR.cactus[0], Math.round(gx0 - 40), gy - 40, 36, 60);
    drawMount(0);
  }

  // ---------- Cartaz voando até a câmera ----------
  function drawPosterLayer(p, t) {
    const cw = pcan.width, ch = pcan.height;
    pctx.clearRect(0, 0, cw, ch);
    if (!posterCanvas || p < P.posterStart || p > P.posterGone) return;
    const fit = Math.min((ch * 0.86) / posterCanvas.height, (cw * 0.9) / posterCanvas.width);
    let scale, x, y, rot, alpha = 1, squash = 1;
    if (p < P.posterArrive) {
      // sai da poeira, girando e se aproximando
      const k = easeOut(prog(p, P.posterStart, P.posterArrive));
      scale = lerp(0.05, 1, k) * fit;
      x = lerp(cw * 0.62, cw / 2, k) + Math.sin(k * 9) * cw * 0.05 * (1 - k);
      y = lerp(ch * 0.62, ch / 2, k) + Math.cos(k * 7) * ch * 0.04 * (1 - k);
      rot = lerp(2.6, 0.04, k) + Math.sin(t * 6) * 0.25 * (1 - k);
      squash = 0.35 + 0.65 * Math.abs(Math.cos(lerp(6, 0, k)));
      alpha = clamp(k * 3);
    } else if (p < P.posterLeave) {
      // fica tremulando no vento
      scale = fit; x = cw / 2; y = ch / 2 + Math.sin(t * 1.3) * ch * 0.006;
      rot = 0.03 + Math.sin(t * 1.7) * 0.025;
      squash = 1 - Math.abs(Math.sin(t * 2.3)) * 0.03;
    } else {
      // é arrancado pelo vento para o alto
      const k = easeIn(prog(p, P.posterLeave, P.posterGone));
      scale = lerp(1, 1.25, k) * fit;
      x = lerp(cw / 2, -cw * 0.4, k); y = lerp(ch / 2, -ch * 0.3, k);
      rot = lerp(0.03, -1.6, k);
      squash = 1 - k * 0.6;
      alpha = 1 - k * 0.3;
    }
    pctx.save();
    pctx.globalAlpha = alpha;
    pctx.translate(x, y);
    pctx.rotate(rot);
    pctx.scale(scale * squash, scale);
    pctx.drawImage(posterCanvas, -posterCanvas.width / 2, -posterCanvas.height / 2);
    pctx.restore();
  }

  // ---------- Narração ----------
  const taleEl = document.getElementById("tale");
  const taleSr = document.getElementById("tale-sr");
  let taleNodes = [];
  function resetTale() {
    taleEl.innerHTML = ""; taleNodes = [];
    TALE.forEach((line) => {
      const el = document.createElement("p");
      if (line.big) el.className = "big";
      const words = line.text.split(" ").map((w, i) => {
        const span = document.createElement("span");
        span.className = "w"; span.textContent = (i ? " " : "") + w;
        el.appendChild(span);
        return span;
      });
      taleEl.appendChild(el);
      taleNodes.push({ el, line, words, shown: 0, announced: false });
    });
  }
  // a frase inteira fica parada no lugar; só as palavras vão acendendo
  function updateTale(p) {
    let current = -1;
    taleNodes.forEach((n, i) => { if (p >= n.line.at) current = i; });
    taleNodes.forEach((n, i) => {
      const next = taleNodes[i + 1];
      const end = next ? next.line.at - 0.6 : P.posterStart + 1.2;
      n.el.classList.toggle("on", i === current && p < end);
      if (i !== current) return;
      const count = Math.min(n.words.length, Math.floor((p - n.line.at) * WORDS_PER_S) + 1);
      for (let k = n.shown; k < count; k++) n.words[k].classList.add("in");
      n.shown = Math.max(n.shown, count);
      if (!n.announced) { n.announced = true; taleSr.textContent = n.line.text; }
    });
  }

  // ---------- Áudio ----------
  // ---------- Trilha: três climas compostos aqui mesmo, tocados pelo navegador (Web Audio) ----------
  // cavalgada (enérgica) → vilarejo (calmo, violão e gaita) → duelo (tenso, assobio e sino)
  // nada de gravação de terceiros: as notas abaixo são originais, sem licença a pedir
  const Audio = (() => {
    let ac = null, master = null, sfx = null, verb = null, nb = null, timer = null, wind = null;
    let enabled = true;
    try { enabled = localStorage.getItem("vila-som") !== "off"; } catch { enabled = true; }
    let want = null;
    const playing = {};

    function impulse(seconds, decay) {
      const len = ac.sampleRate * seconds;
      const buf = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
      return buf;
    }
    function noiseBuffer(seconds) {
      const len = ac.sampleRate * seconds;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }
    function init() {
      if (ac) return;
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = enabled ? 0.9 : 0;
      const limiter = ac.createDynamicsCompressor();
      limiter.threshold.value = -10; limiter.ratio.value = 8; limiter.attack.value = 0.003; limiter.release.value = 0.2;
      master.connect(limiter).connect(ac.destination);
      verb = ac.createConvolver(); verb.buffer = impulse(2.6, 2.4);
      const vg = ac.createGain(); vg.gain.value = 0.35; verb.connect(vg).connect(master);
      sfx = ac.createGain(); sfx.gain.value = 0.8; sfx.connect(master);
      nb = noiseBuffer(0.3);
      timer = setInterval(pump, 120);
    }
    // ---- instrumentos ----
    function pluck(out, time, freq, vel = 0.22, len = 1.1, bright = 9) {
      const o1 = ac.createOscillator(), o2 = ac.createOscillator();
      o1.type = "sawtooth"; o2.type = "triangle";
      o1.frequency.value = freq; o2.frequency.value = freq * 1.003;
      const f = ac.createBiquadFilter(); f.type = "lowpass";
      f.frequency.setValueAtTime(Math.min(5200, freq * bright), time);
      f.frequency.exponentialRampToValueAtTime(Math.max(180, freq * 1.4), time + 0.35);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(vel, time + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, time + len);
      o1.connect(f); o2.connect(f); f.connect(g).connect(out);
      o1.start(time); o2.start(time); o1.stop(time + len + 0.05); o2.stop(time + len + 0.05);
    }
    function twang(out, time, freq, vel = 0.2) {
      const o = ac.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(freq * 1.06, time); o.frequency.exponentialRampToValueAtTime(freq, time + 0.12);
      o.frequency.setValueAtTime(freq, time + 0.9); o.frequency.exponentialRampToValueAtTime(freq * 0.94, time + 2.2);
      const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(2600, time); f.frequency.exponentialRampToValueAtTime(400, time + 1.6);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(vel, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + 2.6);
      o.connect(f).connect(g).connect(out); g.connect(verb); o.start(time); o.stop(time + 2.7);
    }
    function whistle(out, time, freq, dur, vel = 0.11) {
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(freq * 0.97, time); o.frequency.exponentialRampToValueAtTime(freq, time + 0.07);
      const lfo = ac.createOscillator(); lfo.frequency.value = 5.6;
      const lg = ac.createGain(); lg.gain.setValueAtTime(0, time);
      lg.gain.linearRampToValueAtTime(freq * 0.012, time + Math.min(0.4, dur * 0.6));
      lfo.connect(lg).connect(o.frequency);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(vel, time + 0.06);
      g.gain.setValueAtTime(vel, time + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, time + dur + 0.12);
      o.connect(g).connect(out);
      o.start(time); lfo.start(time); o.stop(time + dur + 0.2); lfo.stop(time + dur + 0.2);
    }
    // gaita: palheta com respiração e vibrato
    function harmonica(out, time, freq, dur, vel = 0.05) {
      const o1 = ac.createOscillator(), o2 = ac.createOscillator();
      o1.type = "sawtooth"; o2.type = "square"; o1.frequency.value = freq; o2.frequency.value = freq * 1.004;
      const lfo = ac.createOscillator(); lfo.frequency.value = 5; const lg = ac.createGain(); lg.gain.value = freq * 0.008; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1300; f.Q.value = 1.1;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(vel, time + 0.09);

  }

  function render(dt) {
    const riding = p < P.posterLeave;
    if (riding) {
      const speed = 34 * rate;
      dist += speed * dt;
      const approach = smooth(prog(p, 0, P.townFull));
      drawSky(wall);
      drawMountains();
      drawTownAt(wall, lerp(0.3, 1.7, easeIn(approach)), lerp(1.4, 0.6, approach));
      drawGround(dist);
      drawProps(speed * dt);
      drawPoles(speed * dt);
      updateWeeds(p, dt, rate);
      // galope: velocidade dos quadros acompanha o cavalo
      animPhase += dt * 8.5 * Math.pow(rate, 0.7);
      const f = Math.floor(animPhase) % 4;
      if (f !== lastFrame) {
        if (f === 0 || f === 2) Audio.clop((f === 0 ? 0.26 : 0.16) * (0.8 + rate * 0.2));
        if (f === 1 && rate > 1.4) Audio.clop(0.1);
        lastFrame = f;
      }
      drawMount(f);
      const intensity = easeIn(prog(p, P.dustFrom, P.fogFull));
      emitDust(dt, intensity, rate);
      drawDust(dt);
      ditherFill("#d9b88a", smooth(prog(p, P.fogStart, P.fogFull)));
      updatePapers(p, dt, rate);
      if (!swelled && p > P.fogStart) { swelled = true; Audio.swell((P.fogFull - P.fogStart) / rate + 1.5); }
    } else {
      if (!ended) { ended = true; Audio.finale(); }
      drawArrival(wall);
      ditherFill("#d9b88a", 1 - smooth(prog(p, P.posterLeave, P.revealEnd)));
      updatePapers(p, dt, 1);
    }
    if (!flapped && p > P.posterStart + 1.2) { flapped = true; Audio.flap(); }
    ditherFill("#1b120d", 1 - smooth(prog(p, 0, P.fadeIn)));
    updateTale(p);
    drawPosterLayer(p, wall);
    hint.style.opacity = p > 2 && p < P.posterArrive - 0.5 ? "1" : "0";
    document.body.classList.toggle("cinema", p > 0.3 && p < P.posterStart + 1.0);
    if (p >= P.arrivalText && !finished) finish();
  }

  function enterSite(quick) {
    if (siteOn || !finished) return;
    siteOn = true;
    try { sessionStorage.setItem("vila-chegou", "1"); } catch { /* sem armazenamento: só não lembra */ }
    arrival.hidden = true; hud.hidden = true;
    document.dispatchEvent(new CustomEvent("vila:enter", { detail: { quick: quick === true } }));
  }
  // "Rever a chegada" volta para a tela inicial: dá até para trocar de personagem
  document.addEventListener("vila:replay", () => {
    siteOn = false;
    running = false; finished = false; clearTimeout(autoEnter);
    arrival.hidden = true; arrival.classList.remove("show"); hud.hidden = true; hint.hidden = true;
    document.body.classList.remove("cinema");
    showGate();
  });

  function finish() {
    finished = true;
    skipBtn.hidden = true; hint.hidden = true;
    document.body.classList.remove("cinema");
    clearTimeout(autoEnter);
    // sem tela de "entrar": a cena da chegada sobe e o mural da vila aparece logo em seguida
    if (!skipping) enterSite();
  }

  function begin(withSound) {
    gate.hidden = true; hud.hidden = false; skipBtn.hidden = false;
    arrival.hidden = true; arrival.classList.remove("show");
    caption.hidden = true; hint.hidden = false;
    finished = false; swelled = false; flapped = false; ended = false;
    p = 0; dist = 0; wall = 0; rate = 1; animPhase = 0; lastFrame = -1; setBoost(false);
    resetWorld(); resetTale();
    Audio.cue("ride", true);
    Audio.unlock().then(() => Audio.wind());
    if (reduceMotion) { skip(); return; }
    running = true; last = performance.now();
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame);
  }

  let autoEnter = 0, skipping = false;
  function skip() {
    p = P.revealEnd; ended = false;
    running = true; last = performance.now();
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame);
    finish();
    document.getElementById("enter-vila").focus();
  }

  skipBtn.addEventListener("click", skip);
  document.getElementById("replay").addEventListener("click", () => begin());
  document.getElementById("enter-vila").addEventListener("click", enterSite);
  document.getElementById("enter-prompt").querySelector("kbd").textContent = isTouch ? "Toque em entrar" : "Espaço";
  window.addEventListener("keydown", (e) => {
    if (finished && !siteOn && (e.code === "Space" || e.key === "Enter") && !e.repeat) {
      if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON") return;
      e.preventDefault(); enterSite(); return;
    }
    if (!running || finished) return;
    if (e.code === "Space") { e.preventDefault(); if (!e.repeat) setBoost(true); }
    if (e.key === "Escape") { e.preventDefault(); skip(); }
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") setBoost(false); });
  window.addEventListener("blur", () => setBoost(false));
  canvas.addEventListener("pointerdown", (e) => { if (running && !finished) { e.preventDefault(); setBoost(true); } });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => canvas.addEventListener(ev, () => setBoost(false)));

  window.addEventListener("resize", () => { resize(); buildSprites(); });
  resize();
  buildSprites();
  resetWorld();

  const redrawGate = () => { if (!running) { drawArrival(0); ditherFill("#1b120d", 0.6); } };
  riderImg.onload = () => { buildSprites(); redrawGate(); Object.keys(heroSprites).forEach((k) => delete heroSprites[k]); if (!gate.hidden) paintCards(); };
  redrawGate();

  // o cartaz só é montado quando as fontes e o retrato estão prontos
  const fontsReady = document.fonts
    ? Promise.race([
        Promise.all(["86px Rye", '23px "IM Fell English SC"', 'italic 28px "IM Fell English"'].map((f) => document.fonts.load(f))),
        new Promise((r) => setTimeout(r, 2500)),
      ])
    : Promise.resolve();
  const portraitReady = new Promise((r) => { if (portrait.complete) r(); else { portrait.onload = r; portrait.onerror = r; } });
  Promise.all([fontsReady, portraitReady]).then(buildPoster);

  // ---------- Tela inicial: escolha do personagem ----------
  const cast = document.getElementById("cast");
  const heroView = document.getElementById("hero-view"), hv = heroView.getContext("2d");
  const heroSprites = {};
  function spritesFor(h) {
    if (!heroSprites[h.id]) heroSprites[h.id] = { front: drawHero(h, "front"), side: drawHero(h, "side"), back: drawHero(h, "back") };
    return heroSprites[h.id];
  }
  HEROES.forEach((h) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cast-card"; b.dataset.id = h.id;
    b.setAttribute("role", "radio"); b.setAttribute("aria-label", h.name);
    const cv = document.createElement("canvas"); cv.width = 32; cv.height = 48; cv.setAttribute("aria-hidden", "true");
    const label = document.createElement("span"); label.textContent = h.short;
    b.append(cv, label);
    b.addEventListener("click", () => selectHero(h.id));
    cast.appendChild(b);
  });
  function paintCards() {
    cast.querySelectorAll(".cast-card").forEach((b) => {
      const h = window.VILA_HEROES[b.dataset.id], g = b.querySelector("canvas").getContext("2d");
      g.clearRect(0, 0, 32, 48); g.drawImage(spritesFor(h).front, 0, 0);
      const on = h.id === window.VILA_HERO;
      b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1;
    });
  }
  function selectHero(id, focus) {
    chooseHero(id);
    paintCards();
    document.getElementById("hero-name").textContent = hero().name;
    document.getElementById("hero-tag").textContent = hero().tag;
    if (focus) cast.querySelector(`[data-id="${id}"]`).focus();
  }
  cast.addEventListener("keydown", (e) => {
    const ids = HEROES.map((h) => h.id);
    let i = ids.indexOf(window.VILA_HERO);
    if (e.key === "ArrowRight" || e.key === "ArrowDown") i = (i + 1) % ids.length;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") i = (i - 1 + ids.length) % ids.length;
    else return;
    e.preventDefault(); selectHero(ids[i], true);
  });
  // vitrine: o escolhido fica de frente no pedestal, só respirando (sem girar)
  let lastSpin = 0, gateRaf = 0;
  function drawView(now) {
    lastSpin = now;
    const S = spritesFor(hero());
    const breathe = !reduceMotion && Math.sin(now / 520) > 0.55 ? 1 : 0;
    hv.clearRect(0, 0, 64, 64); hv.imageSmoothingEnabled = false;
    hv.fillStyle = "rgba(0,0,0,0.35)"; hv.fillRect(20, 59, 24, 2); hv.fillRect(22, 61, 20, 1);
    hv.drawImage(S.front, 16, 13 + breathe, 32, 48 - breathe);
    if (!gate.hidden) gateRaf = requestAnimationFrame(drawView);
  }
  function showGate() {
    gate.hidden = false;
    selectHero(window.VILA_HERO);
    cancelAnimationFrame(gateRaf); lastSpin = performance.now(); gateRaf = requestAnimationFrame(drawView);
    redrawGate();
  }
  // a aventura começa com o personagem escolhido
  document.getElementById("start").addEventListener("click", () => {
    chooseHero(window.VILA_HERO);
    prepareRider(); buildSprites();
    cancelAnimationFrame(gateRaf);
    begin();
  });

  // ---------- Alto-falante: um botão só, sempre à mão ----------
  const speaker = document.getElementById("sound");
  function paintSpeaker() {
    const on = Audio.on;
    speaker.setAttribute("aria-pressed", String(on));
    speaker.setAttribute("aria-label", on ? "Som ligado. Clique para silenciar" : "Som desligado. Clique para ligar");
    speaker.classList.toggle("off", !on);
  }
  speaker.addEventListener("click", () => { Audio.setEnabled(!Audio.on); paintSpeaker(); });
  paintSpeaker();
  // o navegador só deixa tocar depois do primeiro toque ou tecla: aí a trilha pedida começa
  const firstGesture = () => { if (Audio.on) Audio.unlock(); };
  window.addEventListener("pointerdown", firstGesture, { once: true, capture: true });
  window.addEventListener("keydown", firstGesture, { once: true, capture: true });
  showGate();

  // quem já chegou nesta visita não precisa cavalgar de novo: vai direto para o mural
  let seen = false;
  try { seen = sessionStorage.getItem("vila-chegou") === "1"; } catch { seen = false; }
  // espera o resto da página (o site) montar antes de entrar
  const enterNow = () => { gate.hidden = true; skipping = true; skip(); skipping = false; enterSite(true); };
  if (seen) { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", enterNow); else setTimeout(enterNow, 0); }
})();
</script>
