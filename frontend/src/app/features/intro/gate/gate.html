<div class="gate-grid">
  <div class="gate-left">
    <p class="kicker">Portfólio de João Pedro</p>
    <h1 id="gate-title" class="title"><span class="t-small">Em busca do</span><span class="t-big">Forasteiro</span></h1>
    <p class="sub">Escolha quem vai seguir a trilha até a vila.</p>
    <div class="cast" id="cast" role="radiogroup" aria-label="Escolha seu personagem" (keydown)="castKey($event)">
      @for (h of cast; track h.id) {
        <button type="button" class="cast-card" #card [attr.data-id]="h.id" role="radio" [attr.aria-label]="h.name" [attr.aria-checked]="h.id === heroId()" [tabIndex]="h.id === heroId() ? 0 : -1" (click)="select(h.id)"><canvas width="32" height="48" aria-hidden="true"></canvas><span>{{ h.short }}</span></button>
      }
    </div>
    <div class="hero-info"><p class="hero-name" id="hero-name">{{ hero().name }}</p><p class="hero-tag" id="hero-tag">{{ hero().tag }}</p></div>
    <button id="start" type="button" (click)="begin.emit()">Iniciar aventura</button>
    <p class="gate-hint">Na estrada, segure espaço (ou a tela) para galopar mais rápido.</p>
  </div>
  <div class="gate-right"><canvas id="hero-view" #heroView width="64" height="64" aria-hidden="true"></canvas></div>
</div>
