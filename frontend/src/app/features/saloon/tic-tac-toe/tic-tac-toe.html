<div class="sp-head"><h3 id="velha-title">Jogo da velha</h3><button type="button" class="sp-close" id="velha-close" aria-label="Fechar o jogo" (click)="closed.emit()">✕</button></div>
<div class="velha-board"><div class="velha" id="velha" #board aria-label="Tabuleiro">
  @for (c of game().cells; track $index) {
    <button type="button" [disabled]="game().over || !!c" [class.win]="game().line?.includes($index) ?? false" [attr.aria-label]="cellLabel($index)" (click)="play($index)">
      @if (c === 'x') {
        <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="3" width="4" height="6" fill="#1b120d"/><rect x="3" y="4" width="6" height="4" fill="#1b120d"/><rect x="5" y="4" width="2" height="4" fill="#3a2a22"/><rect x="1" y="1" width="2" height="1" fill="#5a3820"/><rect x="2" y="2" width="1" height="1" fill="#5a3820"/><rect x="9" y="2" width="2" height="1" fill="#5a3820"/><rect x="9" y="9" width="1" height="2" fill="#5a3820"/><rect x="1" y="9" width="2" height="1" fill="#5a3820"/><rect x="10" y="6" width="1" height="1" fill="#5a3820"/></svg>
      } @else if (c === 'o') {
        <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="1" width="3" height="8" fill="#5a5652"/><rect x="7" y="1" width="3" height="8" fill="#5a5652"/><rect x="3" y="8" width="6" height="3" fill="#5a5652"/><rect x="5" y="9" width="2" height="1" fill="#8a8682"/><rect x="3" y="2" width="1" height="1" fill="#c8c4bc"/><rect x="3" y="5" width="1" height="1" fill="#c8c4bc"/><rect x="8" y="2" width="1" height="1" fill="#c8c4bc"/><rect x="8" y="5" width="1" height="1" fill="#c8c4bc"/></svg>
      }
    </button>
  }
</div></div>
<div class="velha-status">
  <p class="velha-msg" id="velha-msg" aria-live="polite">{{ msg() }}</p>
  <p class="velha-score" id="velha-score">Você {{ tally().you }} · Empates {{ tally().draw }} · Bartender {{ tally().bar }}</p>
</div>
<div class="velha-help">
  <p class="velha-info">Você marca com <b>buracos de bala</b>; o bartender, com <b>ferraduras</b>. Três em linha vencem.</p>
  <button type="button" class="s-btn" id="velha-reset" #reset (click)="again()">Jogar de novo</button>
</div>
