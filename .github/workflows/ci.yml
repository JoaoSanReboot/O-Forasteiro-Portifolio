# CI: build e testes da API (.NET) e do site (Angular) em todo PR e push.
# Na main quem chama este workflow é o deploy.yml, antes de publicar.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Forasteiro.slnx -c Release
      - run: dotnet test Forasteiro.slnx -c Release --no-build

  frontend:
    name: Site (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # sobe o ng serve e confere que o SSR renderiza e destrói o app sem erro (o prerender engole erros do destroy)
      - run: npm run test:ssr
      - run: npx ng build
